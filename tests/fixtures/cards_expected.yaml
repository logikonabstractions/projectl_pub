# Ground-truth values for every card in cards_list.yaml, keyed by card id.
# Used by tests/test_cards.py. When you add a card to cards_list.yaml, add its
# expected values here too (test_fixture_coverage enforces this).
#
#   mask_cell_count: number of playable (true) cells in the mask
#   reward_points:   points awarded for completing the card
#   reward_piece:    the piece the card should award, resolved to its piece name.
#                    cards_list.yaml references pieces by id (P1..P10); the mapping is:
#                    P1=monomino P2=domino P3=small_L P4=straight_3 P5=large_L
#                    P6=square P7=T P8=long_bar P9=large_corner P10=zee
#                    (test_reward_piece currently fails here until the loader resolves the reference)

